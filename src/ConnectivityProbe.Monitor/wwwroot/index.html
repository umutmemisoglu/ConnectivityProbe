<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connectivity Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Üst menü: sayfanın üstünde saydam, aşağı kaydırınca koyulaşır -->
  <header class="topbar" id="topbar">
    <a class="logo" href="/">CONNECTIVITY</a>
    <nav class="tabs">
      <button class="tab" data-tab="monitor" data-i18n="tab.monitor">Monitör</button>
      <button class="tab" data-tab="defs" data-i18n="tab.defs">Tanımlar</button>
      <button class="tab" data-tab="settings" data-i18n="tab.settings">Ayarlar</button>
    </nav>
    <div class="spacer"></div>
    <div class="nav-tools" id="navTools">
      <label class="nav-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
        <input id="search" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off">
      </label>
      <label class="pill-toggle"><input id="onlyProblems" type="checkbox"><span data-i18n="onlyProblems">Sadece sorunlular</span></label>
    </div>
    <span id="meta" class="meta"></span>
    <div class="lang-switch" role="group" data-i18n-title="lang.title">
      <button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button>
    </div>
    <button id="meBtn" class="btn" hidden></button>
    <button id="logout" class="btn" hidden data-i18n="logout" data-i18n-title="logout.title">Çıkış</button>
  </header>

  <main>
    <!-- Monitör: öne çıkan uygulama (billboard) + her ekip için yatay kayan kart satırları -->
    <section id="tab-monitor">
      <div id="billboard" class="billboard"></div>
      <div id="monitorList" class="rows"></div>
    </section>

    <!-- Tanımlar: solda bağlantı havuzu (sayfa kayarken yerinde kalır); sağda üstte birimler/ekipler, altında seçili ekibin uygulamaları -->
    <section id="tab-defs" hidden>
      <div class="defs-grid">
        <div class="panel" id="poolPanel"></div>
        <div class="defs-right">
          <aside class="panel" id="treePanel">
            <div class="panel-head">
              <h2 data-i18n="defs.unitsTeams">Birimler ve ekipler</h2>
              <button id="addUnit" class="btn small" data-i18n="defs.addUnit">+ Birim</button>
            </div>
            <div id="tree"></div>
          </aside>
          <div class="panel" id="appsPanel"></div>
        </div>
      </div>
    </section>

    <!-- Ayarlar: Teams bildirimlerinin tek seferlik kurulumu -->
    <section id="tab-settings" hidden>
      <div class="panel settings" id="settingsPanel"></div>
    </section>
  </main>

  <!-- Uygulama detayı: karta tıklayınca yeni sekmede açılır (/?app=<kimlik>) -->
  <section id="tab-detail" class="detail-page" hidden>
    <div id="detailBody"></div>
  </section>

  <dialog id="dlg">
    <form id="dlgForm">
      <h3 id="dlgTitle"></h3>
      <div id="dlgIntro" class="dlg-intro" hidden></div>
      <div id="dlgFields"></div>
      <p id="dlgWarn" class="dlg-warn" hidden></p>
      <p id="dlgError" class="error"></p>
      <div class="dlg-actions">
        <button type="button" id="dlgCancel" class="btn" data-i18n="dlg.cancel">Vazgeç</button>
        <button type="submit" class="btn primary" data-i18n="dlg.save">Kaydet</button>
      </div>
    </form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="search.js"></script>
  <script src="app.js"></script>
</body>
</html>
