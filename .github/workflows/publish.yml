# ConnectivityProbe paketini nuget.org'a yayınlar (Trusted Publishing: API anahtarı gerekmez).
#
# Tetikleme: "v" ile başlayan bir etiket gönderildiğinde, ör.:
#   git tag v1.0.0
#   git push origin v1.0.0
# Paket sürümü etiketten alınır (v1.0.0 -> 1.0.0). Elle çalıştırmak için Actions sekmesinden "Run workflow".
#
# nuget.org tarafında bu depo ve "publish.yml" dosya adı için bir Trusted Publishing policy tanımlı olmalıdır.

name: publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  id-token: write   # nuget.org'a kimlik kanıtı (OIDC) için gerekli
  contents: write   # GitHub Release oluşturmak için

jobs:
  publish:
    # net462 hedefi de derlendiği için Windows kullanılıyor.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/ConnectivityProbe.Tests -c Release

      - name: Pack
        shell: bash
        run: |
          # Etiketle çalıştıysa sürümü etiketten al (v1.2.3 -> 1.2.3); elle çalıştırıldıysa csproj'daki sürüm kullanılır.
          VERSION_ARG=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION_ARG="-p:Version=${GITHUB_REF_NAME#v}"; fi
          dotnet pack src/ConnectivityProbe/ConnectivityProbe.csproj -c Release -o artifacts -p:ContinuousIntegrationBuild=true $VERSION_ARG

      # Trusted Publishing: GitHub'ın verdiği kimlikle nuget.org'dan kısa ömürlü bir anahtar alınır.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: umut92

      # Windows'ta dotnet nuget push "*" jokerini kendisi açmıyor; dosyaları bash ile tek tek veriyoruz.
      # Aynı klasördeki .snupkg (semboller) her .nupkg ile birlikte otomatik yüklenir.
      - name: Push
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then echo "artifacts klasöründe paket yok"; exit 1; fi
          for p in "${packages[@]}"; do
            echo "Pushing $p"
            dotnet nuget push "$p" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      # GitHub Releases sayfasına sürüm notu: CHANGELOG.md'deki bu sürümün bölümü (İngilizce + Türkçe) ve paketin kendisi.
      - name: GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tr -d '\r' < src/ConnectivityProbe/CHANGELOG.md | awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{if(f)exit} f' > notes.md
          printf '\nNuGet: https://www.nuget.org/packages/ConnectivityProbe/%s\n' "$VERSION" >> notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "ConnectivityProbe $VERSION" --notes-file notes.md --verify-tag
